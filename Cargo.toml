[package]
name = "scriba"
version = "0.25.1"
edition = "2024"
description = "A TUI for recording, transcribing, and enriching audio with LLM-powered insights"
authors = ["Giovanni Alberto Falcione"]
license = "MIT"
repository = "https://github.com/giovannialberto/scriba"
keywords = ["audio", "transcription", "cli", "sherpa-onnx", "openai"]
categories = ["command-line-utilities", "multimedia::audio"]



[dependencies]
structopt = "0.3"
reqwest = { version = "0.11", features = ["multipart", "stream", "json"] }
gag = "1.0"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15.0"
cpal = "0.15.2"
hound = "3.5"
anyhow = "1.0"
dirs = "5.0.1"
lazy_static = "1.4.0"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
unicode-width = "0.1"
rusqlite = { version = "0.29", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
arboard = "3.3"
sherpa-onnx = "1.12"
tar = "0.4"
bzip2 = "0.4"
futures-util = "0.3"
glob = "0.3"
thiserror = "1.0"
schemars = "0.8"
async-trait = "0.1"
scraper = "0.22"
textwrap = "0.16"
rodio = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-screen-capture-kit = { version = "0.3", features = ["SCStream", "SCShareableContent", "alloc", "std"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer"] }
objc2-core-audio-types = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError"] }
block2 = "0.6"
dispatch2 = "0.3"
